name: Release
# Builds signed release artifacts and attaches them to a GitHub Release when a version tag is
# pushed, then publishes the AAB to the Play Store internal track. See docs/RELEASING.md for the
# one-time keystore/secrets/Play Console setup this depends on.
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel mid-release: a cancelled run can leave a partial GitHub Release or a
  # half-uploaded AAB behind.
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    name: Build Signed Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release and upload assets
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No cache: 'gradle' here (unlike ci.yml): this job builds and publishes signed artifacts
      # from a tag push, and a shared Gradle cache keyed across refs is a real cache-poisoning
      # surface for a job with that much blast radius. Releases are infrequent; the cache miss
      # cost is not worth it.
      # JDK 26: the newest JDK Gradle 9.4.1 documents support for (17-26; confirmed via
      # docs.gradle.org/current/userguide/compatibility.html), and a real GA Temurin release
      # (26.0.2, not early-access) - verified locally with a real assembleRelease/bundleRelease
      # build under it before pinning this, not just from the compatibility docs alone. Kept
      # independent of ci.yml's JDK 21 deliberately: this workflow only builds/publishes release
      # artifacts, so nothing here needs to match compileOptions/jvmToolchain(21)'s app-level
      # Kotlin/Java source target in wear/build.gradle.kts - that's a separate, unrelated pin.
      - name: Set up Java JDK 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'temurin'
      # build-tools 37.0.0: the newest stable (non-rc) release available, confirmed via
      # `sdkmanager --list` and verified locally with a real clean build forcing this exact
      # version. platforms;android-36 stays as-is - that has to match compileSdk in
      # wear/build.gradle.kts, which this task didn't ask to change.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-36 build-tools;37.0.0'
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release-upload-keystore.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Build signed release APK and AAB
        # Explicitly the "play" flavor only: the flavor-less assembleRelease/bundleRelease
        # aggregate tasks would also build the "fdroid" flavor (see wear/build.gradle.kts) and
        # this job only ever wants the one that ships to the Play Store.
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :wear:assemblePlayRelease :wear:bundlePlayRelease --no-daemon
      - name: Create GitHub Release
        # Deliberate choice over a `gh release` script step: multi-file glob asset upload is
        # worth the well-known action here.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          files: |
            wear/build/outputs/apk/play/release/*.apk
            wear/build/outputs/bundle/playRelease/*.aab
      - name: Upload AAB as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-aab
          path: wear/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-apk
          path: wear/build/outputs/apk/play/release/*.apk
          if-no-files-found: error
  check-play-secret:
    name: Check Play Store Secret
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has-secret: ${{ steps.check.outputs.has-secret }}
    steps:
      # Secrets can't be referenced directly in a job/step `if:`. Route it through env instead,
      # so the publish job below can skip gracefully (rather than fail) before the one-time Play
      # Console bootstrap in docs/RELEASING.md has happened.
      - name: Check whether PLAY_SERVICE_ACCOUNT_JSON is configured
        id: check
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "has-secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secret=false" >> "$GITHUB_OUTPUT"
          fi
  publish-play-store:
    name: Publish AAB to Play Store (internal track)
    needs: [build, check-play-secret]
    if: needs.check-play-secret.outputs.has-secret == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Fresh runner from the build job: needs its own JDK/Android SDK to run Gradle here, same
      # as the build job's setup (see the comments there for why JDK 26 / build-tools 37.0.0).
      - name: Set up Java JDK 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '26'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-36 build-tools;37.0.0'
      - name: Download AAB artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-aab
          path: release-aab
      - name: Publish to Play Store
        # Gradle Play Publisher (com.github.triplet.play, configured in wear/build.gradle.kts)
        # reads Play credentials from this env var directly - no serviceAccountCredentials file
        # path needed. --artifact-dir points it at the AAB the build job already built and
        # signed instead of having this task build its own.
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew :wear:publishPlayReleaseBundle --artifact-dir release-aab --no-daemon
