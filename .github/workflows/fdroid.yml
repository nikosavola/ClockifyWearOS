name: F-Droid metadata check
# Informational only, not a merge gate (continue-on-error below): this exercises fdroidserver's
# own lint/scanner logic plus fdroiddata's own reference data, both of which can change upstream
# independently of anything in this repo. F-Droid's own merge-request pipeline re-validates
# everything for real at actual submission time - see PR #11's docs/RELEASING.md section 9
# (a separate, not-yet-merged PR) once it lands.
#
# Known real limitation, not something this workflow can fix: fdroidserver's scanner matches
# dependency-declaration lines with a regex anchored at the start of the line (after whitespace),
# so it cannot see this repo's `"fdroidImplementation"(...)`/`"playImplementation"(...)` Kotlin
# string-invoke syntax (used because a typed accessor doesn't exist for a newly introduced flavor
# - see wear/build.gradle.kts's own comment on this) - confirmed empirically by adding a control
# line and observing the scanner catch an unquoted `implementation(...)` call right next to an
# unnoticed quoted one. This check can still catch a genuinely unconditional (non-flavor-gated,
# unquoted) non-free dependency added anywhere - it just cannot verify that flavor-based GMS
# exclusion specifically continues to work as changes are made.
on:
  push:
    branches:
      - main
      - dev
      - 'claude/**'
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  fdroid-check:
    name: fdroid lint + scanner (fdroid flavor)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install fdroidserver
        run: pip install --quiet fdroidserver
      - name: Check metadata versions match wear/build.gradle.kts
        # Neither `fdroid lint` nor `fdroid scanner` cross-checks these against the actual Gradle
        # config - a real release bump here with no matching metadata update would go unnoticed
        # by both, and stay unnoticed indefinitely since this job would keep passing regardless.
        run: |
          gradle_name=$(grep -oP 'versionName = "\K[^"]+' wear/build.gradle.kts)
          gradle_code=$(grep -oP 'versionCode = \K[0-9]+' wear/build.gradle.kts)
          meta_name=$(grep -oP "versionName: '\K[^']+" metadata/fi.nikosavola.clockifywear.fdroid.yml)
          meta_code=$(grep -oP 'versionCode: \K[0-9]+' metadata/fi.nikosavola.clockifywear.fdroid.yml)
          if [ "$gradle_name" != "$meta_name" ] || [ "$gradle_code" != "$meta_code" ]; then
            echo "::error::wear/build.gradle.kts is $gradle_name/$gradle_code but the metadata file says $meta_name/$meta_code - update metadata/fi.nikosavola.clockifywear.fdroid.yml"
            exit 1
          fi
      - name: Fetch F-Droid's categories/anti-features reference data
        # fdroid lint validates Categories/AntiFeatures values against these files, which live in
        # fdroiddata itself, not the fdroidserver package - sparse+shallow clone, just the config/
        # directory (~20MB), not the whole metadata history.
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://gitlab.com/fdroid/fdroiddata.git "$RUNNER_TEMP/fdroiddata-config"
          git -C "$RUNNER_TEMP/fdroiddata-config" sparse-checkout set config
      - name: Prepare a scratch fdroiddata-shaped check directory
        # fdroid lint/scanner expect metadata/<appid>.yml and config/ relative to cwd, not a path
        # you can point them at directly - build a throwaway directory shaped like fdroiddata.
        # Repo: is pointed at this exact checkout (local path, not the GitHub URL) so the scanner
        # clones locally and tests precisely the commit under test, not whatever main resolves to
        # remotely at scan time. The grep guards fail loudly if either placeholder ever stops
        # matching (a rename, a trailing slash, an edited placeholder) instead of the sed silently
        # emitting the unchanged line and testing something other than what these comments promise.
        run: |
          mkdir -p "$RUNNER_TEMP/fdroid-check/metadata"
          cp -r "$RUNNER_TEMP/fdroiddata-config/config" "$RUNNER_TEMP/fdroid-check/config"
          grep -q 'commit: __CI_COMMIT_SHA__' metadata/fi.nikosavola.clockifywear.fdroid.yml
          grep -q 'Repo: https://github.com/nikosavola/ClockifyWearOS' metadata/fi.nikosavola.clockifywear.fdroid.yml
          sed -e "s|commit: __CI_COMMIT_SHA__|commit: $GITHUB_SHA|" \
              -e "s|Repo: https://github.com/nikosavola/ClockifyWearOS|Repo: $GITHUB_WORKSPACE|" \
              metadata/fi.nikosavola.clockifywear.fdroid.yml \
              > "$RUNNER_TEMP/fdroid-check/metadata/fi.nikosavola.clockifywear.fdroid.yml"
      - name: fdroid lint
        working-directory: ${{ runner.temp }}/fdroid-check
        run: fdroid lint fi.nikosavola.clockifywear.fdroid -v
      - name: fdroid rewritemeta --list (informational)
        # Not --format on the lint step above: the tracked file deliberately keeps explanatory
        # comments and field ordering suited for reading, which fdroiddata's own stricter
        # byte-exact format check would flag. This just surfaces what reformatting the real
        # submission copy would need, without stripping comments from this CI-testing copy.
        working-directory: ${{ runner.temp }}/fdroid-check
        run: fdroid rewritemeta -l fi.nikosavola.clockifywear.fdroid || true
      - name: fdroid scanner
        working-directory: ${{ runner.temp }}/fdroid-check
        # --exit-code is a no-op here: fdroidserver's scanner only wires it up for literal .apk
        # file arguments, not appid-based scans (confirmed by reading scanner.py's main()) - the
        # process exits 0 regardless of findings either way, so failure detection has to come from
        # parsing --json output instead. infos (e.g. scandelete removals) are expected, not
        # failures; only real errors/warnings should fail this step.
        run: |
          fdroid scanner fi.nikosavola.clockifywear.fdroid -v -r --json > scanner-output.json
          python3 -c "
          import json, sys
          with open('scanner-output.json') as f:
              data = json.load(f)
          problems = 0
          for appid, builds in data.items():
              for vercode, result in builds.items():
                  for level in ('errors', 'warnings'):
                      for msg, path in result.get(level, []):
                          print(f'{level}: {msg} at {path}')
                          problems += 1
          sys.exit(1 if problems else 0)
          "
