name: CI
# Development happens on `dev` and `claude/**` branches while `main` lags behind, so restricting
# push events to `main` meant the gate never actually ran on the code being written.
on:
  push:
    branches:
      - main
      - dev
      - 'claude/**'
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  verify:
    name: Verify Codebase (Format & Lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Java JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # ubuntu-latest's preinstalled SDK platforms drift with runner image updates, and AGP will
      # not auto-download a missing compileSdk platform, so pin the exact packages this build
      # needs (compileSdk 36 / build-tools 36.0.0) instead of relying on whatever is preinstalled.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Run Codebase Verification (Lint & Format Checks)
        run: ./gradlew lintAll --no-daemon
  test:
    name: Test Suite (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Java JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # See the comment in the verify job: assembleDebug/testDebugUnitTest also configure AGP,
      # which needs compileSdk 36 resolvable.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Build and Run Unit Tests
        # koverXmlReportPlayDebug/koverXmlReport depend on their module's test task, so this both
        # runs every suite and generates the coverage reports Codecov/Sonar read below.
        # companion-protocol is a plain Kotlin/JVM module (no Android variants), so its Kover task
        # is koverXmlReport, not koverXmlReportDebug - see companion-protocol/build.gradle.kts.
        # :wear builds/tests both the "play" (Play Store, has Google Play Services) and "fdroid"
        # (no GMS, see wear/build.gradle.kts) flavors - only "play"'s coverage is uploaded below,
        # since "fdroid" is a strict subset of "play"'s code and would just double-count it.
        run: |
          ./gradlew :wear:assemblePlayDebug :wear:testPlayDebugUnitTest :wear:koverXmlReportPlayDebug \
            :wear:assembleFdroidDebug :wear:testFdroidDebugUnitTest \
            :mobile:assembleDebug :mobile:koverXmlReportDebug \
            :companion-protocol:koverXmlReport --no-daemon
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: wear/build/reports/kover/reportPlayDebug.xml,mobile/build/reports/kover/reportDebug.xml,companion-protocol/build/reports/kover/report.xml
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        # "play" only, not "fdroid" too: nearly every wear test class runs under both flavors with
        # identical names (fdroid just lacks the 4-file companion package's tests), so uploading
        # both would report each shared test twice per run - Codecov's flaky-test heuristics would
        # read a variant-specific failure as the same test both passing and failing. The fdroid
        # build+test still gates this job's pass/fail either way.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: wear/build/test-results/testPlayDebugUnitTest/*.xml,mobile/build/test-results/testDebugUnitTest/*.xml,companion-protocol/build/test-results/test/*.xml
      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports
          path: |
            wear/build/reports/tests/
            mobile/build/reports/tests/
            companion-protocol/build/reports/tests/
