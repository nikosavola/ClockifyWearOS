# .pre-commit-config.yaml
# Optimized pre-commit configuration utilizing prek parallel priority pipelines.
# Ref: https://prek.j178.dev/proposals/concurrency/?h=parallel
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        priority: 10
      - id: end-of-file-fixer
        priority: 10
      - id: mixed-line-ending
        priority: 10
      - id: check-merge-conflict
        priority: 20
      - id: check-added-large-files
        priority: 20
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        priority: 20
  - repo: local
    hooks:
      # Priority 10: Auto-formatting stage. Runs concurrently.
      - id: kotlin-format
        name: Kotlin Codebase Auto-Format (ktfmt & ktlint)
        entry: ./gradlew formatAll --no-daemon
        language: system
        files: \.kts?$
        pass_filenames: false
        priority: 10
      # Priority 20: Strict validation stage. Runs concurrently after Priority 10 completes.
      - id: kotlin-lint
        name: Kotlin Codebase Linter (ktfmt, ktlint & detekt)
        entry: ./gradlew lintAll --no-daemon
        language: system
        files: \.kts?$
        pass_filenames: false
        priority: 20
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        priority: 10
        args: [-conf, ".github/.yamlfmt.yaml"]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        priority: 20
        args: [--strict, "-c=.github/.yamllint.yaml"]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        priority: 20
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor
        priority: 20
