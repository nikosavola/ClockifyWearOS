# Detekt configuration.
#
# `allRules = true` is set in the root build.gradle.kts (the Kotlin analog of enabling clippy's
# pedantic/nursery groups). This file re-disables only rules that genuinely conflict with a
# deliberate choice in this project; everything else detekt offers is left on. Each entry below was
# added because running detekt on this codebase actually flagged it - not preemptively.
comments:
  active: true
  # Public API is documented where it aids understanding, not exhaustively; don't require KDoc on
  # every public declaration (e.g. UserDto's fields, MainActivity, ClockifyTheme).
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
naming:
  active: true
  # Composables (e.g. ClockifyTheme) are PascalCase, so allow an uppercase first letter.
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  # Backtick-quoted, sentence-style JUnit test names (e.g. `decodes known fields and tolerates
  # unknown ones`) are the convention here; that descriptiveness is the point.
  FunctionNameMaxLength:
    active: false
style:
  active: true
  # ktfmt is the sole formatting authority, including multiline raw-string indentation (the JSON
  # fixture in UserDtoTest); it doesn't reindent raw-string bodies to this rule's expectation.
  MultilineRawStringIndentation:
    active: false
exceptions:
  active: true
  # ClockifyRepository/ProjectCache deliberately map these four to a fixed ClockifyError or to an
  # absent cache; the returned value already carries everything a caller acts on, and this data
  # layer has no logging sink to hand the original exception to. Listed by type rather than
  # switching the rule off, so a genuinely swallowed exception of any other type still fails.
  # GeneralSecurityException/IllegalArgumentException are ApiKeyCipher.decrypt's same pattern: any
  # decryption failure (corrupted data, a keystore wiped since it was written) maps to null.
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'DateTimeParseException'
      - 'GeneralSecurityException'
      - 'HttpException'
      - 'IOException'
      - 'IllegalArgumentException'
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'SerializationException'
complexity:
  active: true
  # ClockifyRepository legitimately needs private helpers for pagination, identity lookup and
  # stop-before-start sequencing. Counting them pushed the class over the threshold, and appeasing
  # it by hoisting those helpers to top-level functions forced api/settingsStore/clock to be
  # threaded through as parameters (one helper reached seven). Scope the rule to public API surface
  # instead: the class exposes exactly the eight documented operations.
  TooManyFunctions:
    active: true
    ignorePrivate: true
