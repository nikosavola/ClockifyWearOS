[versions]
agp = "9.2.1"
kotlin = "2.4.0"
wear-compose = "1.6.2"
wear-ongoing = "1.1.0"
wear-tiles = "1.6.2"
wear-protolayout = "1.4.2"
wear-watchface-complications = "1.3.0"
coroutines = "1.9.0"
# Bumped from 1.8.0 to satisfy converter-kotlinx-serialization 3.0.0's core-jvm 1.8.1 floor.
serialization-json = "1.9.0"
androidx-core-ktx = "1.17.0"
# Forces a floor above the androidx.fragment:fragment:1.1.0 that play-services-wearable pulls in
# transitively (see wear/build.gradle.kts's comment) - not otherwise used directly.
androidx-fragment = "1.9.0"
androidx-lifecycle-runtime-ktx = "2.9.3"
androidx-activity-compose = "1.10.1"
# Compose UI resolves to 1.9.0 on this classpath (via wear.compose 1.6.2 / lifecycle 2.9.3); pin
# the UI test artifacts to match so they don't drag the graph to a different Compose version.
compose-ui = "1.9.0"
junit = "4.13.2"
# Retrofit 3.0.0 depends on okhttp 4.12.0 (stable); okhttp 5.x is still alpha-only on Maven
# Central, so 4.12.0 is the newest mutually-stable pairing for the client and its test server.
retrofit = "3.0.0"
okhttp = "4.12.0"
datastore-preferences = "1.2.1"
# Robolectric shims the android.* classes referenced by DataStore's aar so it can run on the host
# JVM under a plain unit test; 4.16.1 is the first stable line with an android-all artifact for
# API 36 (compileSdk here).
robolectric = "4.16.1"
androidx-test-core = "1.7.0"
# The following three are Gradle *plugin* versions, not the underlying formatter/linter versions.
ktfmt = "0.26.0"
ktlint = "14.2.0"
detekt = "2.0.0-alpha.5"
play-publisher = "4.1.1"
kover = "0.9.9"
sonarqube = "7.4.0.8496"
# Wearable Data Layer API, used by both modules for the phone<->watch sign-in handoff (see
# wear/.../companion/ and mobile/.../CompanionProtocol.kt).
play-services-wearable = "20.0.1"
# Compose BOM for the phone module only; wear/build.gradle.kts pins Wear Compose's own artifacts
# directly instead (see its comment on compose-ui resolution), so the two never need to agree.
compose-bom = "2026.08.00"

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle-runtime-ktx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle-runtime-ktx" }
# compose-ui 1.9.0 dropped the deprecated androidx.compose.ui.platform.LocalLifecycleOwner alias,
# so the lifecycle-scoped ticker (repeatOnLifecycle at the collection site) needs this for
# LocalLifecycleOwner and collectAsStateWithLifecycle. Same 2.9.3 line as the rest of the
# lifecycle artifacts here.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle-runtime-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }

wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wear-compose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wear-compose" }
wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wear-ongoing" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wear-tiles" }
# protolayout-material3 = the M3 Expressive tile components; its own POM pins protolayout core to a
# strict [1.4.2], so pin the core explicitly to keep resolution unambiguous against tiles' own core
# dep (same reasoning as AnkiDroid-WearOS's catalog for this exact pairing).
wear-protolayout-material3 = { group = "androidx.wear.protolayout", name = "protolayout-material3", version.ref = "wear-protolayout" }
wear-protolayout-core = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wear-protolayout" }
wear-watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "wear-watchface-complications" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Retrofit 3.0.0 ships Square's own kotlinx.serialization converter, so the separate
# JakeWharton converter (last released for Retrofit 2.9) is unnecessary.
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore-preferences" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidx-fragment" }

play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "play-services-wearable" }
# Same "coroutines" version as kotlinx-coroutines-android above - both are published from the same
# kotlinx.coroutines release train and 1.9.0 exists for both, so there's no reason to let them
# drift apart.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
# No version.ref on the four below: their version comes from the compose-bom platform import in
# mobile/build.gradle.kts, not from this catalog.
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose-ui" }
# debugImplementation only: Compose test rules resolve an activity to host composition through
# this, and it must not ship in release.
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose-ui" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Only companion-protocol (a plain Kotlin/JVM module, no Android APIs) applies this directly -
# every Android module gets Kotlin from AGP's built-in support instead (see its own build.gradle.kts
# comment). No version here (unlike every other plugin alias in this file): the root buildscript's
# forced kotlin-gradle-plugin classpath dependency already puts this plugin on the classpath
# unversioned, and redeclaring a version on top of that fails with "already on the classpath with
# an unknown version, so compatibility cannot be checked".
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
play-publisher = { id = "com.github.triplet.play", version.ref = "play-publisher" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
